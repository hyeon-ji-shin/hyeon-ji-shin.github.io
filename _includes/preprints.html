{%- capture preprint_html -%}
  {% bibliography -f {{ site.scholar.bibliography }} -q @*[preprint=true]* -T preprint %}
{%- endcapture -%}
{% if preprint_html contains "<li" %}
<h2 id="preprints">
  <span lang="en">Preprints</span><span lang="ko">프리프린트</span>
</h2>
<div class="preprints">
  {{ preprint_html }}
</div>
{% endif %}
